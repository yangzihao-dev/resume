          damage: Math.round(this.damage * 0.5),
          fromPlayer: false,
          color: this.color,
          size: 6,
          life: 3500,
        }));
      }
    }
    this._spiralAngle += 0.04;
    this._spawnMinionCD -= dt;
    if (this._spawnMinionCD <= 0 && spawnEnemy && this._phase >= 1) {
      this._spawnMinionCD = 10000 - this._phase * 1800;
      const mx = this.x + (Math.random()*2-1) * this.size*0.6;
      const my = this.y + this.size*0.5;
      spawnEnemy(mx, my, 'boss_minion');
      if (particles) particles.spawn(mx, my, this.color);
    }
    if (this.hp <= 0) this.dead = true;
  }

  _runAttackPattern(ph, player, bullets) {
    const px = player ? player.x : CONFIG.CANVAS_WIDTH/2;
    const py = player ? player.y : CONFIG.CANVAS_HEIGHT/2;
    const pool = ph.attackPool || ['ringSlow', 'fanToPlayer'];
    const pat = pool[Math.floor(Math.random() * pool.length)];
    let newBullets = [];
    switch (pat) {
      case 'ringSlow':
        newBullets = BossPatterns.ringSlow(this.x, this.y, Math.round(this.damage * 0.7));
        break;
      case 'ringFast':
        newBullets = BossPatterns.ringFast(this.x, this.y, Math.round(this.damage * 0.8));
        break;
      case 'doubleRing':
        newBullets = BossPatterns.doubleRing(this.x, this.y, Math.round(this.damage * 0.6));
        break;
      case 'spiral':
        newBullets = BossPatterns.spiral(this.x, this.y, this._spiralAngle, Math.round(this.damage * 0.65));
        break;
      case 'homing':
        newBullets = BossPatterns.homing(this.x, this.y, px, py, 6, Math.round(this.damage * 0.9));
        break;
      case 'fanToPlayer':
        newBullets = BossPatterns.fanToPlayer(this.x, this.y, px, py, 11, Math.PI*0.8, Math.round(this.damage*0.75), 4.2);
        break;
      case 'laser':
        this._laserActive = true;
        this._laserTimer = 1200;
        this._laserAngle = Math.atan2(py - this.y, px - this.x);
        break;
    }
    newBullets.forEach(b => bullets.push(b));
  }

  takeDamage(dmg, particles, bullet) {
    this._flashUntil = performance.now() + 100;
    this.hp = Math.max(0, this.hp - dmg);
    if (bullet) {
      if (bullet.ice) this.applySlow(900);
      if (bullet.fire) this.applyBurn(5 + Math.floor(dmg*0.08), 1200);
    }
    if (particles) particles.hit(this.x + (Math.random()*2-1)*this.size*0.4, this.y + (Math.random()*2-1)*this.size*0.4, this.color);
    if (this.hp <= 0 && particles) particles.bossExplode(this.x, this.y, this.color);
  }

  draw(ctx) {
    const s = this.size;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle + Math.PI/2);
    if (this.slowed) { ctx.shadowBlur = 18; ctx.shadowColor = '#38bdf8'; }
    if (Date.now() < this._burnUntil) { ctx.shadowBlur = 18; ctx.shadowColor = '#f97316'; }
    ctx.fillStyle = '#020617';
    roundRect(ctx, -s*0.58, -s*0.45, s*1.16, s*0.9, 10);
    ctx.fill();
    const grad = ctx.createRadialGradient(0, 0, s*0.1, 0, 0, s*0.6);
    grad.addColorStop(0, this._lighten(this.color, 0.3));
    grad.addColorStop(1, this._darken(this.color, 0.35));
    ctx.fillStyle = grad;
    roundRect(ctx, -s*0.56+3, -s*0.43+3, s*1.12-6, s*0.86-6, 8);
    ctx.fill();
    ctx.shadowBlur = 16; ctx.shadowColor = this.color;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = 2;
    roundRect(ctx, -s*0.56+3, -s*0.43+3, s*1.12-6, s*0.86-6, 8);
    ctx.stroke();
    ctx.shadowBlur = 0;
    const tr = s * 0.32;
    ctx.fillStyle = '#0b1220';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i/8) * Math.PI * 2;
      const r = i % 2 === 0 ? tr : tr * 0.75;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = this._lighten(this.color, 0.4);
    ctx.lineWidth = 2;
    ctx.shadowBlur = 10; ctx.shadowColor = this.color;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#dc2626';
    ctx.shadowBlur = 12; ctx.shadowColor = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, 0, s*0.12, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    const cannonCount = 3;
    for (let i = -1; i <= 1; i++) {
      const offset = i * s * 0.32;
      ctx.fillStyle = '#0b1220';
      ctx.save();
      ctx.translate(offset, 0);
      const bl = s * 0.65, bW = s * 0.1;
      ctx.fillRect(-bW/2, -bl, bW, bl);
      ctx.fillStyle = this._lighten(this.color, 0.2);
      ctx.fillRect(-bW/2+1, -bl, bW-2, bl-4);
      ctx.fillStyle = '#020617';
      ctx.fillRect(-bW*0.8, -bl-2, bW*1.6, 2);
      ctx.restore();
    }
    // Boss 受击闪白
    if (performance.now() < this._flashUntil) {
      ctx.save();
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(-s*0.7,-s*0.7,s*1.4,s*1.4);
      ctx.restore();
    }
    ctx.restore();
    if (this._laserActive && player) {
      this._drawLaser(ctx);
    }
    if (this._entered) this._drawHPBar(ctx);
  }
  _drawLaser(ctx) {
    if (!this._laserActive) return;
    this._laserTimer -= 16;
    if (this._laserTimer <= 0) { this._laserActive = false; return; }
    if (this._laserTimer > 900) {
      ctx.save();
      ctx.strokeStyle = 'rgba(168,85,247,0.5)';
      ctx.setLineDash([8, 6]);
      ctx.lineWidth = 3;
      ctx.beginPath();
      const ex = this.x + Math.cos(this._laserAngle) * CONFIG.CANVAS_WIDTH;
      const ey = this.y + Math.sin(this._laserAngle) * CONFIG.CANVAS_WIDTH;
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(ex, ey);
      ctx.stroke();
      ctx.restore();
      return;
    }
    const ex = this.x + Math.cos(this._laserAngle) * CONFIG.CANVAS_WIDTH;
    const ey = this.y + Math.sin(this._laserAngle) * CONFIG.CANVAS_WIDTH;
    const dmg = Math.round(this.damage * 0.08);
    const ls = laserBullets(this.x, this.y, ex, ey, dmg);
    if (window.__bossLaserBullets) ls.forEach(b => window.__bossLaserBullets.push(b));
    ctx.save();
    const al = Math.abs(Math.sin(Date.now() / 60)) * 0.6 + 0.4;
    ctx.globalAlpha = al;
    ctx.strokeStyle = '#a855f7';
    ctx.shadowBlur = 24; ctx.shadowColor = '#a855f7';
    ctx.lineWidth = 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y); ctx.lineTo(ex, ey);
    ctx.stroke();
    ctx.strokeStyle = '#e9d5ff';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }
  _drawHPBar(ctx) {
    const w = CONFIG.CANVAS_WIDTH * 0.7, h = 14;
    const x = (CONFIG.CANVAS_WIDTH - w) / 2, y = 14;
    ctx.save();
    ctx.fillStyle = 'rgba(2,6,23,0.85)';
    roundRect(ctx, x-3, y-3, w+6, h+6, 4);
    ctx.fill();
    ctx.fillStyle = '#1e293b';
    roundRect(ctx, x, y, w, h, 3);
    ctx.fill();
    const ratio = this.hp / this.maxHp;
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, '#ef4444');
    grad.addColorStop(1, '#f97316');
    ctx.fillStyle = grad;
    ctx.shadowBlur = 12; ctx.shadowColor = '#ef4444';
    roundRect(ctx, x, y, w * Math.max(0, ratio), h, 3);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${this.name}  阶段 ${this._phase + 1}/${this.phases.length}  HP ${this.hp}/${this.maxHp}`, x + w/2, y + h - 3);
    ctx.restore();
  }
  _hexToRgb(hex) {
    const m = hex.replace('#','');
    return {
      r: parseInt(m.substring(0,2),16),
      g: parseInt(m.substring(2,4),16),
      b: parseInt(m.substring(4,6),16),
    };
  }
  _rgbToHex(r,g,b) {
    return '#' + [r,g,b].map(x => clamp(Math.round(x),0,255).toString(16).padStart(2,'0')).join('');
  }
  _lighten(hex, amt) {
    const c = this._hexToRgb(hex);
    return this._rgbToHex(c.r + (255-c.r)*amt, c.g + (255-c.g)*amt, c.b + (255-c.b)*amt);
  }
  _darken(hex, amt) {
    const c = this._hexToRgb(hex);
    return this._rgbToHex(c.r * (1-amt), c.g * (1-amt), c.b * (1-amt));
  }
}

// Pickup.apply 逻辑（拾取效果）
Pickup.prototype.apply = function(player) {
  const t = this.type;
  const res = { score: 0 };
  switch (t) {
    case 'hp':   player.heal(30); break;
    case 'hpmax': player.maxHp += 20; player.heal(20); break;
    case 'shield': player.addShield(1); break;
    case 'coin': player.coins += 10; res.score = 20; break;
    case 'gem':  player.coins += 50; res.score = 100; break;
    case 'power': player.tempPowerUntil = Date.now() + 12000; break;
    case 'speed': player.tempSpeedUntil = Date.now() + 12000; break;
    case 'spread': player.buffSpread = Math.min(5, player.buffSpread + 1); break;
    case 'pierce': player.buffPierce = Math.min(5, player.buffPierce + 1); break;
    case 'bounce': player.buffBounce = Math.min(3, player.buffBounce + 1); break;
    case 'fire': player.buffFire = true; break;
    case 'ice':  player.buffIce = true; break;
    case 'multi': player.buffMulti = Math.min(3, player.buffMulti + 1); break;
    case 'rate':  player.fireRateMul *= 0.82; break;
    case 'dmg':   player.damageMul *= 1.2; break;
    case 'spd':   player.speedMul *= 1.15; break;
    case 'bspeed':player.bspeedMul *= 1.12; break;
    case 'splash':player.splashMul += 0.5; player._baseSplash = player._baseSplash || 20; break;
    case 'crit':  player.critChance = Math.min(0.7, player.critChance + 0.08); break;
    case 'critdmg': player.critDmgMul += 0.5; break;
    case 'lifesteal': player._lifesteal = (player._lifesteal || 0) + 0.1; break;
    case 'healspeed': break; // TODO
  }
  return res;
};

// Enemy.isElite 兼容
Enemy.prototype.isElite = function() {
  return this.typeKey === 'elite' || this.typeKey === 'boss_minion';
};
// Boss.phase 兼容 + hpRatio + maxPhase
Object.defineProperty(Boss.prototype, 'maxPhase', { get() { return this.phases.length; }});
Boss.prototype.hpRatio = function() { return this.hp / this.maxHp; };
Boss.prototype.takeDamage_Compat = function(dmg, bx, by) {
  this.hp = Math.max(0, this.hp - dmg);
  const killed = this.hp <= 0;
  return { dmg, weakHit: false, killed };
};

// ============ 游戏主类 ============
class Game {
  constructor() {
    this.canvas = document.getElementById('canvas');
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    this.input = new Input(this.canvas);
    this.sound = new SoundManager();
    this.particles = new ParticleSystem();

    this.state = 'menu';
    this.mode = 'classic';
    this.selectedTank = 'medium';

    this.player = null;
    this.map = new GameMap();
    this.bullets = [];
    this.enemies = [];
    this.pickups = [];
    this.boss = null;
    this.level = 1;
    this.wave = 1;
    this.maxWave = 5;
    this.score = 0;
    this.kills = 0;
    this.elapsed = 0;
    this.lastTime = 0;
    this.shakeTime = 0;
    this.shakeIntensity = 0;
    this.pendingBuffChoices = null;

    this.enemySpawnCD = 0;
    this.enemiesLeftToSpawn = 0;
    this.surviveSpawnCD = CONFIG.SPAWN.SURVIVE_INTERVAL;
    this.bossSpawned = false;
    // ========== 打击感：命中停顿 (hitstop) + 震动分级 ==========
    this.hitstopRemaining = 0; // 全局逻辑冻结时间（毫秒）
    this.SHAKE_LEVEL = {
      LIGHT:   [3, 120],   // 小命中
      MEDIUM:  [8, 300],   // 普通兵死亡 / 小爆炸
      HEAVY:   [18, 550],  // 精英死亡 / Boss 阶段切换 / 玩家受伤
      CRITICAL:[28, 1200], // Boss 死亡 / 基地被毁
    };
    // 命中停顿（肉感）：敌人死亡/被击中时调用，上限 35ms 避免整体卡顿
    this.addHitstop = (ms)=> { this.hitstopRemaining = Math.min(35, this.hitstopRemaining + ms); };

    this._lastPausePress = 0;
    this._damagePops = [];
    window.__bossLaserBullets = this.bullets;

    this._settings = this._loadSettings();
    this._applySettings();
    this._bindUI();
    this._renderTankCards();
    this._refreshHighScores();
    this.start();
  }

  start() {
    requestAnimationFrame(t => this.loop(t));
  }
  loop(t) {
    const dt = Math.min(50, t - this.lastTime || 16);
    this.lastTime = t;
    const input = this.input.getState();
    // 暂停切换：只用 ESC/P 「刚按下」那一帧（边沿检测），避免连按多切
    if (input.justPause && (this.state === 'playing' || this.state === 'paused')) {
      this.togglePause();
    }
    // 给上层 update 用：暂停时也允许读 input（用于菜单输入）
    this._lastInput = input;
    if (this.state === 'playing') this.update(dt, input);
    this.render();
    requestAnimationFrame(nt => this.loop(nt));
  }

  startGame(mode, tankKey) {
    this.mode = mode;
    this.level = 1;
    this.score = 0;
    this.kills = 0;
    this.elapsed = 0;
    this.selectedTank = tankKey || this.selectedTank;
    this.bullets = []; this.enemies = []; this.pickups = []; this.boss = null;
    window.__bossLaserBullets = this.bullets;
    this.bossSpawned = false;
    this._bossRushIndex = undefined;
    this._switchScreen('game');
    this._initLevel();
    this.state = 'playing';
  }

  _initLevel() {
    if (this.mode === 'roguelike') {
      const types = ['battle','battle','elite','treasure'];
      const t = pick(types);
      this.map.generateRoguelikeRoom(t);
      this._roguelikeRoomType = t;
    } else if (this.mode === 'bossrush') {
      this.map.generateRoguelikeRoom('battle');
      this._bossRushIndex = (this._bossRushIndex ?? -1) + 1;
    } else {
      this.map.loadLevel(this.level - 1);
    }
    const ps = this.map.getPlayerSpawn();
    if (!this.player || this.level === 1) {
      this.player = new Player(ps.x, ps.y, this.selectedTank);
    } else {
      this.player.x = ps.x; this.player.y = ps.y;
      this.player.heal(this.player.maxHp * 0.4);
      this.player.pendingBulletBurst = [];
    }
    this.bullets = []; this.enemies = []; this.pickups = []; this.boss = null;
    window.__bossLaserBullets = this.bullets;
    this.bossSpawned = false;
    this.wave = 1;

    if (this.mode === 'classic') {
      this.maxWave = 5;
      this.enemiesLeftToSpawn = 18 + this.level * 3;
      this.enemySpawnCD = 800;
    } else if (this.mode === 'survive') {
      this.maxWave = Infinity;
      this.enemiesLeftToSpawn = Infinity;
      this.surviveSpawnCD = 2500;
    } else if (this.mode === 'roguelike') {
      this._setupRoguelikeRoom();
    } else if (this.mode === 'bossrush') {
      this._scheduleBossForBossRush();
    }
    this._updateHUD();
    this._hideBossBar();
  }

  _setupRoguelikeRoom() {
    this.enemiesLeftToSpawn = 0;
    const t = this._roguelikeRoomType;
    if (t === 'battle') {
      const n = 4 + randInt(0, 4);
      for (let i = 0; i < n; i++) this._spawnRandomEnemy();
      this.maxWave = 1;
    } else if (t === 'elite') {
      const types = Object.keys(CONFIG.ENEMY_TYPES).filter(k => k !== 'healer');
      const tk = pick(types);
      const sp = this.map.getRandomSpawn();
      this.enemies.push(new EliteEnemy(sp.x, sp.y, tk));
      this._spawnRandomEnemy(2);
      this.maxWave = 1;
    } else if (t === 'treasure') {
      this._spawnPickupCluster(this.map.cols/2*32, this.map.rows/2*32, 5, { treasure:true });
      setTimeout(() => this._showBuffSelect('宝箱！选择一项强化'), 400);
      this.maxWave = 1;
    }
  }

  _scheduleBossForBossRush() {
    const order = ['crab','magneto','lava','ghost','apoc'];
    const bid = order[this._bossRushIndex % order.length];
    setTimeout(() => this._spawnBoss(bid), 1200);
  }

  // ============ 更新主函数 ============
  update(dt, input) {
    // Hitstop 命中停顿：全局时间冻结（但 render 还会跑），给玩家「实打实打中」的肉感
    if (this.hitstopRemaining > 0) {
      this.hitstopRemaining -= dt;
      // 粒子和震动也在 hitstop 时停下（否则只有世界不冻粒子动，不真实）
      return;
    }
    this.elapsed += dt;
    // 鼠标瞄准：更新玩家炮塔 targetAngle（优先鼠标，若没鼠标 input.aim=null 则玩家按移动方向转）
    if (input.aim && this.player) {
      const dx = input.aim.x - this.player.x;
      const dy = input.aim.y - this.player.y;
      if (dx*dx + dy*dy > 100) { // 距离太近不转（避免鼠标在坦克身上狂抖）
        this.player.targetAngle = Math.atan2(dy, dx);
      }
    }
    this.player.update(dt, input, this.map, this.particles);
    if (input.fire) {
      const bs = this.player.tryFire(dt, true);
      if (bs && bs.length) {
        this.bullets.push(...bs);
        this.sound.shoot();
        for (const b of bs) this.particles.muzzle(b.x - b.vx, b.y - b.vy, this.player.angle, '#fde68a');
      }
    } else {
      this.player.tryFire(dt, false);
    }
    // 被燃烧弹/冰冻弹命中玩家时 apply 状态
    this._lastInputForState = input;
    this._updateEnemySpawning(dt);
    for (const e of this.enemies) e.update(dt, this.player, this.map, this.bullets, this.particles);
    if (this.boss) {
      const self = this;
      this.boss.update(dt, this.player, this.map, this.bullets, this.particles, (x,y,tk) => self._spawnEnemyAt(x,y,tk));
    }
    for (const b of this.bullets) b.update(dt, this.map);
    this._resolveCollisions();
    for (const p of this.pickups) p.update(dt);
    this.particles.update(dt);
    if (this.shakeTime > 0) this.shakeTime -= dt;
    this._checkLevelProgress();
    this._updateHUD();
  }

  _updateEnemySpawning(dt) {
    if (this.boss) return;
    if (this.mode === 'classic') {
      if (this.enemiesLeftToSpawn > 0 && this.enemies.length < CONFIG.SPAWN.CLASSIC_MAX_ON_SCREEN) {
        this.enemySpawnCD -= dt;
        if (this.enemySpawnCD <= 0) {
          // 前慢后快：L1 ≈ 1000~1700ms/只；L10 ≈ 400~1100ms/只
          const base = Math.max(350, 1100 - (this.level||1) * 70);
          this.enemySpawnCD = base + Math.random()*700;
          this._spawnRandomEnemy();
          this.enemiesLeftToSpawn--;
        }
      }
    } else if (this.mode === 'survive') {
      this.surviveSpawnCD -= dt;
      if (this.surviveSpawnCD <= 0) {
        this.surviveSpawnCD = Math.max(1000, CONFIG.SPAWN.SURVIVE_INTERVAL - Math.floor(this.elapsed/20000)*500);
        const n = 1 + Math.floor(this.elapsed / 30000);
        this._spawnRandomEnemy(n);
        const waveIdx = Math.floor(this.elapsed / 45000);
        if (!this.bossSpawned && waveIdx > (this._lastSurviveBossWave || -1)) {
          this._lastSurviveBossWave = waveIdx;
          this.bossSpawned = true;
          const bossKeys = ['crab','magneto','lava','ghost'];
          this._spawnBoss(bossKeys[waveIdx % bossKeys.length]);
        }
      }
    }
  }

  _spawnRandomEnemy(n=1) {
    const types = Object.keys(CONFIG.ENEMY_TYPES);
    for (let i = 0; i < n; i++) {
      const weights = { scout:5, assault:4, sniper:2, bomber:2, shield:1.5, healer:1, elite:0.5 };
      let total = 0;
      for (const k of types) total += (weights[k] !== undefined ? weights[k] : 1);
      let r = Math.random() * total;
      let tk = 'scout';
      for (const k of types) { r -= (weights[k] !== undefined ? weights[k] : 1); if (r <= 0) { tk = k; break; } }
      const sp = this.map.getRandomSpawn();
      this._spawnEnemyAt(sp.x, sp.y, tk);
    }
  }

  _spawnEnemyAt(x, y, tk) {
    if (tk === 'elite' || tk === 'boss_minion') {
      this.enemies.push(new EliteEnemy(x, y, tk));
    } else {
      this.enemies.push(new Enemy(x, y, tk));
    }
  }

  _spawnBoss(bossId) {
    this.bossSpawned = true;
    const b = new Boss(this.level - 1, bossId);
    this.boss = b;
    this.sound.bossWarn();
    this.particles.bossWarn && this.particles.bossWarn();
    this.shake(16, 500);
    this._showBossBar(b);
  }

  // ============ 碰撞 ============
  _resolveCollisions() {
    for (const bu of this.bullets) {
      if (bu.dead) continue;
      const hit = Collision.bulletVsMap(bu, this.map);
      if (hit && hit.hit) {
        if (hit.tileType === CONFIG.TILE.BASE) {
          this.map.baseDestroyed = true;
          this.shake(22, 900);
          if (this.map.basePos) {
            this.particles.explode(this.map.basePos.x, this.map.basePos.y, '#ef4444');
          }
          this.sound.explosion(true);
        } else if (hit.tileType === CONFIG.TILE.BRICK || hit.tileType === CONFIG.TILE.STEEL) {
          this.particles.hit(bu.x, bu.y, '#cbd5e1');
          if (bu.bounce > 0) {
            if (Math.abs(bu.vx) > Math.abs(bu.vy)) bu.vx = -bu.vx;
            else bu.vy = -bu.vy;
            bu.bounce--;
            continue;
          }
        }
        if (bu.splash > 0) this._doExplosion(bu.x, bu.y, bu.splash, bu.damage, bu.fromPlayer);
        bu.dead = true;
      }
    }
    for (const bu of this.bullets) {
      if (bu.dead) continue;
      const br = { x:bu.x-bu.size*0.7, y:bu.y-bu.size*0.7, w:bu.size*1.4, h:bu.size*1.4 };
      if (bu.fromPlayer) {
        for (const e of this.enemies) {
          if (e.dead) continue;
          if (bu.hitEntities && bu.hitEntities.has(e)) continue;
          if (Collision.rect(br, e.rect)) {
            if (bu.hitEntities) bu.hitEntities.add(e);
            e.takeDamage(bu.damage, this.particles, bu);
            this.particles.hit(bu.x, bu.y, e.color);
            this.sound.hit();
            if (bu.splash > 0) this._doExplosion(bu.x, bu.y, bu.splash, bu.damage, true);
            if (e.dead || e.hp <= 0) this._onEnemyKilled(e);
            if (this.player && this.player._lifesteal && (e.dead || e.hp <= 0)) {
              this.player.heal(Math.floor(bu.damage * this.player._lifesteal));
            }
            if (bu.pierce > 0) { bu.pierce--; }
            else { bu.dead = true; break; }
          }
        }
        if (!bu.dead && this.boss && !this.boss.dead) {
          if (Collision.circleRect(bu.x, bu.y, bu.size, this.boss.rect)) {
            if (!bu.hitEntities || !bu.hitEntities.has(this.boss)) {
              if (bu.hitEntities) bu.hitEntities.add(this.boss);
              const res = this.boss.takeDamage_Compat(bu.damage, bu.x, bu.y);
              this.boss.takeDamage(0, this.particles, bu);
              this.particles.hit(bu.x, bu.y, this.boss.color);
              this.sound.hit();
              this._popupDamage(bu.x, bu.y, res.dmg, false);
              if (bu.pierce > 0) bu.pierce--;
              else bu.dead = true;
              if (res.killed) this._onBossKilled();
            }
          }
        }
      } else {
        if (!this.player._invincibleUntil || Date.now() > this.player._invincibleUntil) {
          if (Collision.circleRect(bu.x, bu.y, bu.size, this.player.rect)) {
            if (bu.splash > 0) this._doExplosion(bu.x, bu.y, bu.splash, bu.damage, false);
            else {
              const res = this.player.takeDamage(bu.damage);
              if (res) {
                this.particles.hit(this.player.x, this.player.y, res === 'shield' ? '#38bdf8' : '#ef4444');
                this.sound.playerHurt();
                this.shake(res === 'hp' ? 8 : 5, res === 'hp' ? 300 : 150);
              }
            }
            // 敌弹状态效果：燃烧 / 冰冻 对玩家生效（之前只对 Enemy/Boss 生效）
            if (bu.ice)  this.player.applySlow(1400);
            if (bu.fire) this.player.applyBurn(4 + Math.floor(bu.damage * 0.15), 1800);
            bu.dead = true;
          }
        }
      }
    }
    this.bullets = this.bullets.filter(b => !b.dead);
    for (const p of this.pickups) {
      if (p.dead) continue;
      if (Collision.rect(this.player.rect, p.rect)) {
        const res = p.apply(this.player);
        if (res.score) this.score += res.score;
        this.sound.pickup();
        this.particles.pickup(p.x, p.y, p.color);
        p.dead = true;
      }
    }
    this.pickups = this.pickups.filter(p => !p.dead);
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (e.hp <= 0) this._onEnemyKilled(e);
    }
    this.enemies = this.enemies.filter(e => !e.dead);
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (Collision.circleRect(e.x, e.y, e.size*0.4, this.player.rect)) {
        const r = this.player.takeDamage(Math.round(e.damage*0.4));
        if (r) {
          this.sound.playerHurt();
          this.shake(5, 200);
          const dx = this.player.x - e.x, dy = this.player.y - e.y;
          const d = Math.sqrt(dx*dx+dy*dy)||1;
          this.player.x += dx/d * 8; this.player.y += dy/d * 8;
        }
      }
    }
    if (this.player.hp <= 0) this._gameOver(false, '坦克被击毁');
    if (this.mode === 'classic' && this.map.baseDestroyed) this._gameOver(false, '基地被摧毁');
  }

  _popupDamage(x, y, dmg, weak) {
    if (!this._damagePops) this._damagePops = [];
    this._damagePops.push({ x, y: y - 12, text: '-' + Math.round(dmg), life: 700, maxLife: 700, color: weak ? '#fca5a5' : '#fef3c7' });
  }

  _doExplosion(x, y, radius, damage, fromPlayer) {
    this.particles.explode(x, y, '#fbbf24');
    this.sound.explosion(false);
    this.shake(6, 200);
    const rr = radius * radius;
    if (fromPlayer) {
      for (const e of this.enemies) {
        if (e.dead) continue;
        if (dist2(x, y, e.x, e.y) <= rr) {
          e.takeDamage(damage, this.particles, null);
          if (e.hp <= 0) this._onEnemyKilled(e);
        }
      }
      if (this.boss && !this.boss.dead && dist2(x, y, this.boss.x, this.boss.y) <= (radius + this.boss.size/2) ** 2) {
        const res = this.boss.takeDamage_Compat(damage * 0.7, x, y);
        this.boss.takeDamage(0, this.particles, null);
        if (res.killed) this._onBossKilled();
      }
    } else {
      if (dist2(x, y, this.player.x, this.player.y) <= rr) {
        const r = this.player.takeDamage(damage);
        if (r) { this.sound.playerHurt(); this.shake(10, 300); }
      }
    }
  }

  // ============ 事件回调 ============
  _onEnemyKilled(e) {
    if (e.dead) return;
    e.dead = true;
    this.kills++;
    this.score += e.score;
    this.particles.explode(e.x, e.y, e.color);
    this.sound.explosion(false);
    // 命中停顿 + 震动分级：精英 > 普通
    const isElite = e.isElite();
    if (isElite) { this.addHitstop(22); this.shake(...this.SHAKE_LEVEL.HEAVY); }
    else         { this.addHitstop(7);  this.shake(...this.SHAKE_LEVEL.MEDIUM); }
    const dropChance = isElite ? 1 : 0.35;
    if (Math.random() < dropChance) this._spawnRandomPickup(e.x, e.y, isElite);
  }

  _onBossKilled() {
    if (!this.boss) return;
    const b = this.boss;
    b.dead = true;
    this.boss = null;
    this.kills++;
    this.score += 3000 + this.level * 1500;
    this.shake(...this.SHAKE_LEVEL.CRITICAL);
    this.addHitstop(32); // Boss 死亡大停顿
    this.sound.explosion(true);
    this._hideBossBar();
    const colors = ['#fbbf24','#f97316','#ef4444','#c026d3','#a855f7'];
    for (let i = 0; i < 6; i++) {
      setTimeout(() => {
        this.particles.explode(
          b.x + rand(-b.size/2, b.size/2),
          b.y + rand(-b.size/2, b.size/2),
          i === 5 ? '#ef4444' : colors[i % colors.length]
        );
        this.sound.explosion(i===5);
      }, i * 180);
    }
    setTimeout(() => {
      this._spawnPickupCluster(b.x, b.y, 7 + Math.floor(this.level/2));
      if (this.mode === 'classic' || this.mode === 'bossrush' || this.mode === 'roguelike') {
        this._showBuffSelect('击败 BOSS！选择强力强化');
      }
    }, 900);
    this.bossSpawned = false;
  }

  _spawnRandomPickup(x, y, elite=false) {
    const entries = Object.entries(CONFIG.PICKUPS);
    let total = 0;
    for (const [k,v] of entries) total += v.weight * (k === 'gem' && elite ? 3 : 1);
    let r = Math.random() * total;
    let key = 'coin';
    for (const [k,v] of entries) {
      r -= v.weight * (k === 'gem' && elite ? 3 : 1);
      if (r <= 0) { key = k; break; }
    }
    this.pickups.push(new Pickup(x + rand(-12, 12), y + rand(-12, 12), key));
  }
  _spawnPickupCluster(x, y, n=5, opts={}) {
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const r = 20 + (opts.treasure ? 10 : 30);
      this._spawnRandomPickup(x + Math.cos(a)*r, y + Math.sin(a)*r, opts.treasure || i === 0);
    }
  }

  // ============ 关卡推进 ============
  _checkLevelProgress() {
    if (this.mode === 'roguelike' && (this._roguelikeRoomType === 'battle' || this._roguelikeRoomType === 'elite')) {
      if (!this._roomCleared && this.enemies.length === 0 && !this.boss && this.enemiesLeftToSpawn === 0) {
        this._roomCleared = true;
        this._showBuffSelect(this._roguelikeRoomType === 'elite' ? '精英清剿完成！' : '战斗完成！选择强化');
      }
    }
    if (this.mode === 'classic') {
      if (this.enemies.length === 0 && !this.boss && this.enemiesLeftToSpawn === 0) {
        const bossLevels = [3,5,7,9,10];
        if (bossLevels.includes(this.level) && !this.bossSpawned) {
          const idx = bossLevels.indexOf(this.level);
          const keys = ['crab','magneto','lava','ghost','apoc'];
          setTimeout(() => this._spawnBoss(keys[idx]), 1200);
          this.bossSpawned = true;
        } else if (!bossLevels.includes(this.level)) {
          this._showBuffSelect(`第 ${this.level} 关通过！`);
        } else {
          if (!this.boss) this._nextLevel();
        }
      }
    }
  }

  _nextLevel() {
    this.level++;
    if (this.mode === 'classic' && this.level > 10) {
      this._gameOver(true, '全关卡通关！');
      return;
    }
    if (this.mode === 'bossrush' && (this._bossRushIndex ?? 0) >= 4) {
      this._gameOver(true, '全部 BOSS 讨伐成功！');
      return;
    }
    this._roomCleared = false;
    this._initLevel();
    this.state = 'playing';
  }

  // ============ Buff 三选一 ============
  _showBuffSelect(title='关卡完成！选择强化') {
    this.state = 'buff-select';
    const pool = [...CONFIG.BUFFS];
    const picks = [];
    for (let i = 0; i < 3 && pool.length; i++) {
      const idx = randInt(0, pool.length - 1);
      picks.push(pool.splice(idx, 1)[0]);
    }
    this.pendingBuffChoices = picks;
    const el = document.getElementById('buff-select');
    const sub = document.getElementById('buff-subtitle');
    const list = document.getElementById('buff-cards');
    if (!el || !sub || !list) { this._afterBuffSelected(); return; }
    sub.textContent = title;
    list.innerHTML = '';
    picks.forEach((b, i) => {
      const card = document.createElement('div');
      card.className = 'buff-card';
      card.innerHTML = `
        <div class="bc-icon">${b.icon}</div>
        <div class="bc-name">${b.name}</div>
        <div class="bc-desc">${b.desc}</div>
      `;
      card.addEventListener('click', () => {
        if (this.state !== 'buff-select') return;
        b.apply(this.player);
        this.sound.buff();
        for (let i = 0; i < 3; i++) this.particles.pickup(this.player.x, this.player.y, '#fbbf24');
        el.classList.add('hidden');
        this.pendingBuffChoices = null;
        this._afterBuffSelected();
      });
      list.appendChild(card);
    });
    el.classList.remove('hidden');
  }
  _afterBuffSelected() {
    if (this.mode === 'classic' || this.mode === 'bossrush') this._nextLevel();
    else if (this.mode === 'roguelike') this._nextLevel();
    else this.state = 'playing';
  }

  // ============ 渲染 ============
  render() {
    const ctx = this.ctx;
    ctx.fillStyle = CONFIG.COLORS.BG;
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    this._drawGrid();
    ctx.save();
    if (this.shakeTime > 0) {
      const s = this.shakeIntensity;
      ctx.translate((Math.random()-0.5)*s, (Math.random()-0.5)*s);
    }
    if (this.state === 'menu') { ctx.restore(); return; }
    this.map.drawBottom(ctx);
    for (const p of this.pickups) p.draw(ctx);
    for (const e of this.enemies) e.draw(ctx);
    if (this.boss) this.boss.draw(ctx);
    if (this.player) this.player.draw(ctx);
    for (const b of this.bullets) b.draw(ctx);
    this.map.drawTop(ctx);
    this.particles.draw(ctx);
    this._drawDamagePops();
    if (this._magPulseEffect) {
      const t = (Date.now() - this._magPulseEffect.start) / this._magPulseEffect.dur;
      if (t >= 1) this._magPulseEffect = null;
      else {
        ctx.save();
        ctx.globalAlpha = 0.5 * (1 - t);
        ctx.fillStyle = '#c026d3';
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        ctx.restore();
      }
    }
    ctx.restore();
  }

  _drawGrid() {
    const ctx = this.ctx;
    ctx.strokeStyle = CONFIG.COLORS.GRID;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.7;
    const s = CONFIG.TILE_SIZE;
    for (let x = 0; x <= this.canvas.width; x += s) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.canvas.height); ctx.stroke();
    }
    for (let y = 0; y <= this.canvas.height; y += s) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.canvas.width, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  _drawDamagePops() {
    if (!this._damagePops) return;
    const ctx = this.ctx;
    const dt = 16;
    const out = [];
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
    for (const p of this._damagePops) {
      p.life -= dt;
      p.y -= 0.5;
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 6; ctx.shadowColor = p.color;
      ctx.fillText(p.text, p.x, p.y);
      out.push(p);
    }
    ctx.restore();
    this._damagePops = out;
  }

  // ============ 屏幕震动 ============
  shake(intensity, duration) {
    if (!this._settings.shake) return;
    this.shakeIntensity = Math.max(this.shakeIntensity, intensity);
    this.shakeTime = Math.max(this.shakeTime, duration);
  }

  // ============ HUD ============
  _updateHUD() {
    if (!this.player) return;
    const hpFill = document.getElementById('hp-fill');
    const hpTxt = document.getElementById('hp-text');
    const shFill = document.getElementById('shield-fill');
    const shTxt = document.getElementById('shield-text');
    const wave = document.getElementById('wave');
    const waveMax = document.getElementById('wave-max');
    const kills = document.getElementById('kills');
    const coins = document.getElementById('coins');
    const time = document.getElementById('time');
    const score = document.getElementById('score');
    const levelInfo = document.getElementById('level-info');
    const wname = document.getElementById('weapon-name');
    if (hpFill) {
      const hpr = this.player.hp / this.player.maxHp;
      hpFill.style.transform = `scaleX(${Math.max(0, hpr)})`;
      hpTxt.textContent = `${Math.ceil(this.player.hp)} / ${this.player.maxHp}`;
      const shr = this.player.shieldCount / this.player.maxShield;
      shFill.style.transform = `scaleX(${clamp(shr,0,1)})`;
      shTxt.textContent = `护盾 ${this.player.shieldCount} / ${this.player.maxShield}`;
    }
    if (wave) wave.textContent = this.wave;
    if (waveMax) waveMax.textContent = this.maxWave === Infinity ? '∞' : this.maxWave;
    if (kills) kills.textContent = this.kills;
    if (coins) coins.textContent = this.player.coins;
    if (time) time.textContent = formatTime(this.elapsed);
    if (score) score.textContent = this.score.toLocaleString();
    if (wname) {
      const parts = [];
      if (this.player.buffSpread>1) parts.push(`×${this.player.buffSpread}`);
      if (this.player.buffPierce>0) parts.push(`穿${this.player.buffPierce}`);
      if (this.player.buffBounce>0) parts.push(`弹${this.player.buffBounce}`);
      if (this.player.buffFire) parts.push('🔥');
      if (this.player.buffIce) parts.push('❄');
      const now = Date.now();
      if (now < this.player.tempPowerUntil) parts.push('⚡强化');
      if (now < this.player.tempSpeedUntil) parts.push('»加速');
      wname.textContent = (parts.length ? parts.join(' · ') : '标准炮');
    }
    if (levelInfo) {
      const modeNames = { classic:'经典闯关', survive:'无尽生存', roguelike:'Roguelike地牢', bossrush:'Boss Rush' };
      if (this.mode === 'classic' || this.mode === 'bossrush') {
        levelInfo.textContent = `第 ${this.level} 关 · ${modeNames[this.mode]}`;
      } else {
        levelInfo.textContent = `${modeNames[this.mode]}`;
      }
    }
  }
  _showBossBar(b) {
    const bar = document.getElementById('boss-bar');
    const name = document.getElementById('boss-name');
    const phase = document.getElementById('boss-phase');
    const fill = document.getElementById('boss-fill');
    if (!bar) return;
    name.textContent = `◈ ${b.name} ◈`;
    phase.textContent = `阶段 1 / ${b.maxPhase}`;
    fill.style.transform = 'scaleX(1)';
    bar.classList.remove('hidden');
  }
  _updateBossBar() {
    if (!this.boss) return;
    const fill = document.getElementById('boss-fill');
    const phase = document.getElementById('boss-phase');
    if (fill) fill.style.transform = `scaleX(${Math.max(0, this.boss.hpRatio())})`;
    if (phase) phase.textContent = `阶段 ${this.boss.phase + 1} / ${this.boss.maxPhase}`;
  }
  _hideBossBar() {
    const bar = document.getElementById('boss-bar');
    if (bar) bar.classList.add('hidden');
  }

  // ============ 暂停 / 结算 ============
  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      const p = document.getElementById('pause');
      if (p) p.classList.remove('hidden');
    } else if (this.state === 'paused') {
      this.state = 'playing';
      const p = document.getElementById('pause');
      if (p) p.classList.add('hidden');
    }
  }

  _gameOver(win, reason) {
    if (this.state === 'gameover' || this.state === 'victory') return;
    this.state = win ? 'victory' : 'gameover';
    const el = document.getElementById('gameover');
    const title = document.getElementById('result-title');
    const detail = document.getElementById('result-detail');
    if (!el || !title || !detail) return;
    title.textContent = win ? '▸ 胜 利 凯 旋 ◂' : '▸ 任 务 失 败 ◂';
    title.className = win ? 'glow-green' : 'glow-red';
    const modeLabel = {classic:'经典',survive:'无尽',roguelike:'地牢',bossrush:'BossRush'}[this.mode] || this.mode;
    detail.innerHTML = `
      <div>${win ? '🎖️ 任务完成！' : '💥 ' + reason}</div>
      <div>模式: <b>${modeLabel}</b></div>
      <div>关卡: <b>第 ${this.level} 关</b></div>
      <div>击杀: <b>${this.kills}</b></div>
      <div>金币: <b>${this.player ? this.player.coins : 0}</b></div>
      <div>分数: <b>${this.score.toLocaleString()}</b></div>
      <div>用时: <b>${formatTime(this.elapsed)}</b></div>
    `;
    el.classList.remove('hidden');
    if (win) this.sound.victory(); else this.sound.gameover();
    this._saveScore(win);
    this._refreshHighScores();
  }

  // ============ 排行榜 / 设置 ============
  _saveScore(win) {
    const mode = this.mode;
    const key = `tankbattle_${mode}_scores`;
    let list = [];
    try { list = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
    list.push({
      score: this.score,
      level: this.level,
      kills: this.kills,
      win: !!win,
      tank: this.selectedTank,
      date: new Date().toISOString().slice(0,16).replace('T',' '),
    });
    list.sort((a,b) => b.score - a.score);
    list.splice(10);
    try { localStorage.setItem(key, JSON.stringify(list)); } catch(e) {}
    const totalKills = Number(localStorage.getItem('tankbattle_total_kills') || 0);
    try { localStorage.setItem('tankbattle_total_kills', String(totalKills + this.kills)); } catch(e) {}
    const best = Number(localStorage.getItem(`tankbattle_${mode}_highscore`) || 0);
    if (this.score > best) {
      try { localStorage.setItem(`tankbattle_${mode}_highscore`, String(this.score)); } catch(e) {}
    }
    const bestLv = Number(localStorage.getItem(`tankbattle_${mode}_bestlevel`) || 0);
    if (this.level > bestLv) {
      try { localStorage.setItem(`tankbattle_${mode}_bestlevel`, String(this.level)); } catch(e) {}
    }
  }

  _refreshHighScores() {
    const mode = 'classic';
    const score = Number(localStorage.getItem(`tankbattle_${mode}_highscore`) || 0);
    const level = Number(localStorage.getItem(`tankbattle_${mode}_bestlevel`) || 0);
    const kills = Number(localStorage.getItem('tankbattle_total_kills') || 0);
    const hs = document.getElementById('hs-score');
    const hl = document.getElementById('hs-level');
    const hk = document.getElementById('hs-kills');
    if (hs) hs.textContent = score.toLocaleString();
    if (hl) hl.textContent = level;
    if (hk) hk.textContent = kills.toLocaleString();
  }

  _loadSettings() {
    try {
      return Object.assign({
        sound: true,
        volume: 70,
        quality: 'high',
        shake: true,
        joystick: 'auto',
      }, JSON.parse(localStorage.getItem('tankbattle_settings') || '{}'));
    } catch (e) {
      return { sound:true, volume:70, quality:'high', shake:true, joystick:'auto' };
    }
  }
  _saveSettings() {
    try { localStorage.setItem('tankbattle_settings', JSON.stringify(this._settings)); } catch(e) {}
  }
  _applySettings() {
    this.sound.setEnabled(this._settings.sound);
    this.sound.setVolume(this._settings.volume / 100);
    this.particles.setEnabled(this._settings.quality === 'high');
    const tc = document.getElementById('touch-controls');
    if (tc) {
      const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
      let show = false;
      if (this._settings.joystick === 'on') show = true;
      else if (this._settings.joystick === 'off') show = false;
      else show = isTouch;
      tc.classList.toggle('hidden', !show);
    }
  }

  // ============ UI 绑定 ============
  _bindUI() {
    document.body.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const a = btn.dataset.action;
      if (this.sound && this.sound.ctx) this.sound.ctx.resume?.();
      this._onAction(a, btn);
    });
    const st = document.getElementById('sound-toggle');
    const vol = document.getElementById('volume');
    const ql = document.getElementById('quality');
    const sh = document.getElementById('shake-toggle');
    const js = document.getElementById('joystick-toggle');
    if (st) st.checked = this._settings.sound;
    if (vol) vol.value = this._settings.volume;
    if (ql) ql.value = this._settings.quality;
    if (sh) sh.checked = this._settings.shake;
    if (js) js.value = this._settings.joystick;

    document.querySelectorAll('.lb-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.lb-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        this._renderLeaderboard(tab.dataset.mode);
      });
    });
    this._renderLeaderboard('classic');
  }

  _onAction(action, btn) {
    switch (action) {
      case 'tankselect': this._switchScreen('tank-select'); break;
      case 'back-menu': this._switchScreen('menu'); break;
      case 'confirm-tank':
        this.startGame('classic', this.selectedTank);
        break;
      case 'start-survive': this.startGame('survive', this.selectedTank); break;
      case 'start-roguelike': this.startGame('roguelike', this.selectedTank); break;
      case 'start-bossrush': this._bossRushIndex = -1; this.startGame('bossrush', this.selectedTank); break;
      case 'settings': this._switchScreen('settings'); break;
      case 'leaderboard': this._switchScreen('leaderboard'); this._renderLeaderboard('classic'); break;
      case 'save-settings':
        const st = document.getElementById('sound-toggle');
        const vol = document.getElementById('volume');
        const ql = document.getElementById('quality');
        const sh = document.getElementById('shake-toggle');
        const js = document.getElementById('joystick-toggle');
        this._settings.sound = st ? st.checked : true;
        this._settings.volume = vol ? Number(vol.value) : 70;
        this._settings.quality = ql ? ql.value : 'high';
        this._settings.shake = sh ? sh.checked : true;
        this._settings.joystick = js ? js.value : 'auto';
        this._saveSettings(); this._applySettings();
        this._switchScreen('menu'); break;
      case 'resume': this.togglePause(); break;
      case 'restart':
        const pp = document.getElementById('pause');
        if (pp) pp.classList.add('hidden');
        this.startGame(this.mode, this.selectedTank);
        break;
      case 'quit':
        const p1 = document.getElementById('pause');
        const p2 = document.getElementById('gameover');
        const p3 = document.getElementById('buff-select');
        if (p1) p1.classList.add('hidden');
        if (p2) p2.classList.add('hidden');
        if (p3) p3.classList.add('hidden');
        this.state = 'menu'; this._bossRushIndex = undefined;
        this._switchScreen('menu'); break;
      case 'retry':
        const go = document.getElementById('gameover');
        if (go) go.classList.add('hidden');
        this.startGame(this.mode, this.selectedTank);
        break;
      case 'skip-buff':
        if (this.player) this.player.coins += 100;
        const bs = document.getElementById('buff-select');
        if (bs) bs.classList.add('hidden');
        this._afterBuffSelected();
        break;
    }
  }

  _switchScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const id = { menu:'menu', 'tank-select':'tank-select', game:'game', settings:'settings', leaderboard:'leaderboard' }[name];
    if (id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('active');
    }
  }

  _renderTankCards() {
    const wrap = document.getElementById('tank-cards');
    if (!wrap) return;
    wrap.innerHTML = '';
    for (const [key, conf] of Object.entries(CONFIG.PLAYER_TYPES)) {
      const card = document.createElement('div');
      card.className = 'tank-card' + (this.selectedTank === key ? ' selected' : '');
      const cvs = document.createElement('canvas');
      cvs.width = 160; cvs.height = 90;
      this._drawTankPreview(cvs, conf.color, 28);
      const tc = document.createElement('div');
      tc.className = 'tc-preview'; tc.appendChild(cvs);
      const nm = document.createElement('div');
      nm.className = 'tc-name'; nm.style.color = conf.color; nm.textContent = conf.name;
      const st = document.createElement('div');
      st.className = 'tc-stats';
      const stars = (n,max=5) => {
        const s = Math.round(Math.min(n, max)/max*5);
        return '★'.repeat(s) + '☆'.repeat(5-s);
      };
      st.innerHTML = `
        <div class="tc-stat-row"><span>血量</span><b>${conf.hp}</b></div>
        <div class="tc-stat-row"><span>移速</span><b>${stars(conf.speed*1.2)}</b></div>
        <div class="tc-stat-row"><span>伤害</span><b>${conf.damage}</b></div>
        <div class="tc-stat-row"><span>射速</span><b>${stars(1000/conf.fireRate)}</b></div>
        <div class="tc-stat-row"><span>弹速</span><b>${stars(conf.bs)}</b></div>
      `;
      card.append(tc, nm, st);
      const self = this;
      card.addEventListener('click', () => {
        self.selectedTank = key;
        document.querySelectorAll('.tank-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        const bc = document.getElementById('btn-confirm-tank');
        if (bc) bc.disabled = false;
      });
      wrap.appendChild(card);
    }
    const bc = document.getElementById('btn-confirm-tank');
    if (bc) bc.disabled = !this.selectedTank;
    // --- DEV ONLY: 自动选择第一个坦克 + 自动出击 ---
    if (!this.selectedTank && wrap.firstElementChild) {
      try { wrap.firstElementChild.click(); } catch(e){}
    }
    const bc2 = document.getElementById('btn-confirm-tank');
    if (bc2 && !bc2.disabled) {
      setTimeout(() => { try { bc2.click(); } catch(e){} }, 250);
    }
  }

  _drawTankPreview(canvas, color, size) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    const p = new Player(0, 0, 'medium');
    p.color = color; p.size = size; p.maxHp = 100; p.hp = 100; p.shieldCount = 0;
    p.draw(ctx);
    ctx.restore();
  }

  _renderLeaderboard(mode) {
    const list = document.getElementById('lb-list');
    if (!list) return;
    const key = `tankbattle_${mode}_scores`;
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(key) || '[]'); } catch(e) {}
    if (arr.length === 0) {
      list.innerHTML = '<div class="lb-empty">暂无记录，快去挑战吧！</div>';
      return;
    }
    list.innerHTML = '';
    arr.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'lb-row';
      const rankCls = i===0 ? 'lb-rank gold' : i===1 ? 'lb-rank silver' : i===2 ? 'lb-rank bronze' : 'lb-rank';
      const tankName = (CONFIG.PLAYER_TYPES[it.tank] || {}).name || it.tank;
      row.innerHTML = `
        <div class="${rankCls}">#${i+1}</div>
        <div class="lb-score">${it.score.toLocaleString()}</div>
        <div class="lb-sub">
          <span>Lv.${it.level}</span>
          <span>击杀 ${it.kills}</span>
          <span>${tankName}</span>
          <span style="opacity:.6">${it.date}</span>
        </div>
      `;
      list.appendChild(row);
    });
  }
}

// 启动游戏
window.addEventListener('DOMContentLoaded', () => {
  try {
    window.game = new Game();
    // Auto-start modes via URL params: ?autoplay=1 (classic) or ?autoplay=endless/roguelite/bossrush/tank=medium etc
    try {
      const qs = (location.search||'').replace(/^\?/,'').split('&');
      const params = {};
      qs.forEach(s => { if (!s) return; const p=s.split('='); params[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||''); });
      let playMode = null;
      if (params.autoplay==='1' || params.autoplay==='classic') playMode='classic';
      else if (params.autoplay==='endless' || params.autoplay==='survive') playMode='survive';
      else if (params.autoplay==='roguelite' || params.autoplay==='roguelike') playMode='roguelike';
      else if (params.autoplay==='bossrush' || params.autoplay==='boss') playMode='bossrush';
      window.__AUTO_TANK__ = params.tank || 'medium';
      if (playMode) {
        setTimeout(() => {
          try {
            // IMPORTANT: correct API is startGame(mode, tankKey) NOT start(mode)
            window.game.startGame(playMode, window.__AUTO_TANK__ || 'medium');
          }
          catch (err) {
            console.error('AUTOSTART FAIL:', err);
            try {
              const el = document.getElementById('error-info');
              if (el) { el.style.display='block'; el.textContent='自动启动失败: ' + err.message + '\\n' + (err.stack||'').slice(0,600); el.style.whiteSpace='pre-wrap'; }
            } catch(e){}
            // also push to our error queue
            try {
              const fn = window['__ERRPUSH__']; if (fn) fn('AUTOSTART FAIL: ' + err.message + ' ' + (err.stack||'').slice(0,800));
            } catch(e){}
          }
        }, 900);
      }
    } catch(err) { console.warn('autoplay parse:', err); }
  } catch (e) {
    console.error('Game init error:', e);
    const el = document.getElementById('error-info');
    if (el) { el.style.display = 'block'; el.textContent = '启动失败: ' + e.message + '\\n' + (e.stack||'').slice(0,400); el.style.whiteSpace='pre-wrap'; }
  }
});
</script>
